<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student details </title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" type="image/png" href="static/images/Untitled-design1.png">
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>
    
    <link rel="stylesheet"
          href="{{ url_for('static', filename='table.css') }}">

<h1>STUDENT DETAILS</h1>
<form action="/msg" method="post">
   <table border="1">
       <tr>
           <th>REG NO</th>
           <th>NAME</th> 
           <th>CLASS</th>
           <th>CHECK LIST</th>
       </tr>
       {% for result in results  %}
       <tr>
           <td>{{result[0]}}</td>
           <td>{{result[1]}}</td>
           <td>{{result[2]}}</td>
           <td><input type="checkbox" name="checkbox" value="{{result[0]}}" class="student-check"></td>
          
       </tr>
       {% endfor %}
   </table>
   <div class="button-container">
    <div id="loading-screen">
    <div class="spinner"></div>
    <h2>please wait...</h2>
    <p>Submitting...</p>
</div>
<button type="submit" class="submit-btn" onclick="showLoading()">Submit</button>
    <button type="button" class="clear-btn" onclick="clearCheckboxes()">Clear</button>
</form>
<form action="/add">
<div class="button-container1">
    <button type="submit" class="add-btn1">ADD STD
          <i class="fa-solid fa-user-plus"></i> 
    </button> 
</div>
</form>
<form action="/delete">
<div class="button-container2">
  <button type="submit" class="remove-btn">REMOVE STD
    <i class="fa-solid fa-user-minus"></i>
</button>
</div>
</form>
</body>
</html>
