<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    
    <link rel="icon" type="image/png" href="static/images/Untitled-design1.png">
</head>
<body>
    

    <link rel="stylesheet"
          href="{{ url_for('static', filename='login.css') }}">

   <h2>Login Form</h2>

    <form action="/logined" method="post">
         

        <label for="email">Gmail:</label><br>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your Gmail"
            required
        ><br><br>

        <label for="password">Password:</label><br>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter Password"
            required
        ><br><br>

        <button type="submit">Login</button>
        <button type="reset">Clear</button>

    </form>
    <script src="./login.js"></script>

</body>
</html>
