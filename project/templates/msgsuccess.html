<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="static/images/Untitled-design1.png">
<title>SMS Sent Successfully</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='msgsuccess.css') }}">

<div class="success-card">

    <div class="icon">
        <i class="fa-solid fa-check"></i>
    </div>

    <h1>SMS Sent Successfully!</h1>

    <p>Your message has been delivered successfully.</p>

    <div class="details">
        <div>
            <strong>Status</strong>
            <span class="status">Delivered</span>
        </div>
    </div>

    <div class="countdown">
        Redirecting to Dashboard in
        <span id="timer">5</span>s
    </div>
    <div class="buttons">
        <button onclick="location.href='/table'">
            Back To Table
        </button>
    </div>
</div>
<script src="{{ url_for('static', filename='msgsuccess.js') }}"></script>
</body>

</html>
