<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="icon" type="image/png" href="static/images/Untitled-design1.png">
</head>
    

<body>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='register.css') }}">
    <video autoplay muted loop id="bg-video">
        <source src="static/images/background clip.mp4" type="video/mp4">
    </video>

    <div class="container">
        <form class="form-box" action="/success" method="post">
            <h2>Register form</h2>

            <label for="email">Gmail</label>
            <input type="email" id="email" name="email" placeholder="Enter your Gmail" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your Password" required>

            <button type="submit">Register</button>

            <h5>DO YOU HAVE AN ACCOUNT ALREADY? <a href="/login">LOGIN</a></h5><br>

        </form>
    </div>

</body>
</html>
